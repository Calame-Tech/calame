<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calame</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f4;
        --fg: #1c1917;
        --muted: #78716c;
        --accent: #57534e;
        --ring: rgba(28, 25, 23, 0.12);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1917;
          --fg: #fafaf9;
          --muted: #a8a29e;
          --accent: #d6d3d1;
          --ring: rgba(250, 250, 249, 0.15);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 32px;
        text-align: center;
      }

      .logo {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid var(--ring);
        border-top-color: var(--accent);
        animation: spin 0.85s linear infinite;
      }

      .status {
        font-size: 14px;
        color: var(--muted);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="logo">Calame</div>
      <div class="spinner" role="status" aria-label="Chargement"></div>
      <div class="status">Démarrage du serveur…</div>
    </div>
  </body>
</html>
